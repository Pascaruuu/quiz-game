# lefthook.yml

pre-commit:
  parallel: true
  commands:
    prevent-main-commit:
      skip: git diff --cached --quiet
      run: pnpm prevent-main-commit
    # 1. Linting and Formatting
    # Use {staged_files} to only check what you're committing

    # let's format it directly instead of just checking it.
    # check-format:
    #   glob: '*.{js,ts,svelte,json,md,css}'
    #   run: npx prettier --check {staged_files}
    format:
      glob: '*.{js,jsx,ts,tsx,svelte,json,md,css,html,yml,yaml}'
      run: npx prettier --write --ignore-unknown {staged_files} && git add {staged_files}

    lint:
      glob: '*.{js,jsx,ts,tsx,svelte}'
      run: npx eslint --quiet --cache --cache-strategy {staged_files}

    # 2. Spell Check
    # Restrict to the globs defined in your package.json
    spell-check:
      glob: '{src/**/*.{svelte,ts,js,css,html},*.config.{js,ts},README.md}'
      run: npx cspell {staged_files}

    # 3. Svelte-specific Type Checking
    # This usually needs the whole project context, so we run the full script
    svelte-check:
      run: pnpm check

    audit:
      run: pnpm audit

  fail-text: push blocked due to build or test failures
    please resolve the issues above before pushing.

pre-push:
  parallel: true
  commands:
    type-check:
      glob: '*.{js,jsx,ts,tsx,svelte}'
      run: pnpm check
    test-unit:
      glob: '*.{js,jsx,ts,tsx,svelte,css}'
      run: pnpm run test:unit --run
    test-e2e:
      glob: '{*.{js,jsx,ts,tsx,svelte},package.json}'
      run: pnpm run test:e2e
  fail-text: push blocked due to build or test failures
    please resolve the issues above before pushing.
